<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Arena Champions - an original single-player tactical arena battle with profile progression, in Korean and English."
    />
    <!--
      Fonts are SELF-HOSTED, not pulled from a CDN. The previous Google Fonts
      <link> was render-blocking on a third-party origin, which cost ~12s to
      first paint on a slow link and made the game unusable offline. The subsets
      in public/fonts/ cover every codepoint this game renders; licenses sit
      beside them. Paths are RELATIVE so they resolve under both the dev base
      ("/") and the Pages base ("/open-games/champs/").
    -->
    <!--
      Only the SMALL display faces are preloaded. The two Noto Sans KR weights are
      539 KB and 555 KB, and preloading them made this game's cold load 1226 KB
      against 366-395 KB for the other four - a metered-data player waited for 1.09
      MB of typography before the game itself.

      They are deliberately NOT preloaded now. The @font-face rules below already
      use font-display: swap, so the text renders immediately in the fallback and
      re-renders once the face arrives; preloading only bought a slightly earlier
      swap while competing with the game bundle for the same scarce bandwidth. The
      Cinzel faces stay because they are 17 KB each and carry the title's identity.

      Subsetting these two properly is the real fix - whiteout does the same job
      with 76 KB across two weights - but it needs a font toolchain that is not
      installed here. See scripts/budget-baseline.json.
    -->
    <link
      rel="preload"
      href="./fonts/Cinzel-SemiBold.subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/Cinzel-Bold.subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Noto Sans KR';
        src: url('./fonts/NotoSansKR-Regular.subset.woff2') format('woff2');
        font-weight: 400 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans KR';
        src: url('./fonts/NotoSansKR-Bold.subset.woff2') format('woff2');
        font-weight: 600 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Cinzel';
        src: url('./fonts/Cinzel-SemiBold.subset.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Cinzel';
        src: url('./fonts/Cinzel-Bold.subset.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <title>아레나 챔피언스 · Arena Champions</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
